<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="preload" href="Montserrat-Bold.woff2" as="font" type="font/woff2" crossorigin>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Timer</title>

<style>

@font-face{
    font-family:"MontserratCustom";
    src:url("Montserrat-Bold.woff2") format("woff2");
    font-weight:bold;
    font-display:block;
}


body{
    font-family: Arial, sans-serif;
    background:#111;
    color:#fff;
    text-align:center;
    margin:0;
    padding:30px;
}

.container{
    max-width:700px;
    margin:auto;
}

button.exercise{
    padding:12px 18px;
    margin:6px;
    font-size:16px;
    border:none;
    border-radius:6px;
    background:#2b6cb0;
    color:white;
}

.timer{
    font-size:64px;
    margin:30px 0;
}

.status{
    font-size:22px;
    margin-bottom:20px;
}

.buttonWrapper{
    width:220px;
    margin:auto;
    cursor:pointer;
}

svg{
    width:220px;
}

.centerText{
    font-family:"MontserratCustom", sans-serif;
    font-size:110px;
    fill:black;
    dominant-baseline:middle;
    text-anchor:middle;
    pointer-events:none;
    opacity:1;
    transition:opacity 0.02s linear;
}

</style>
</head>

<body>

<div class="container">

<h1>Тренировка кора</h1>

<div>
<button class="exercise" onclick="selectExercise('Vacuum',15,10,10)">Vacuum</button>
<button class="exercise" onclick="selectExercise('Планка',40,45,3)">Планка</button>
<button class="exercise" onclick="selectExercise('Dead Bug',40,30,3)">Dead Bug</button>
<button class="exercise" onclick="selectExercise('Bird Dog',40,30,3)">Bird Dog</button>
<button class="exercise" onclick="selectExercise('Боковая планка',30,30,2)">Боковая планка</button>
</div>

<div class="timer" id="timer">00:00</div>
<div class="status" id="status">Выберите упражнение</div>

<div class="buttonWrapper" id="mainButton">

<img id="startButton" src="core-button.png" width="220">

<svg id="stopButton" viewBox="0 0 560 442" style="display:none">

<defs>
<clipPath id="buttonClip">
<rect x="0" y="0" width="560" height="442" rx="160"/>
</clipPath>
</defs>

<!-- base -->
<rect x="0" y="0" width="560" height="442" rx="160" fill="#005D35"/>

<!-- work fill -->
<rect id="greenFill" x="0" y="0" width="0" height="442" rx="40" fill="#00FF90" clip-path="url(#buttonClip)"/>

<!-- center text -->
<text id="centerLabel" x="280" y="221" class="centerText">1/3</text>

</svg>

</div>

</div>

<script>

let exerciseName=""
let workTime=0
let restTime=0
let sets=0

let currentSet=0
let phase="idle"

let phaseStart=0
let phaseDuration=0

let animationId=null

let wakeLock=null;

async function requestWakeLock(){
    try{
        if("wakeLock" in navigator){
            wakeLock = await navigator.wakeLock.request("screen")
        }
    }catch(e){}
}

function releaseWakeLock(){
    if(wakeLock){
        wakeLock.release()
        wakeLock=null
    }
}

const button=document.getElementById("mainButton")

const startBtn=document.getElementById("startButton")
const stopBtn=document.getElementById("stopButton")

const greenFill=document.getElementById("greenFill")
const label=document.getElementById("centerLabel")

const timer=document.getElementById("timer")
const status=document.getElementById("status")

function playBeep(){
    const file = (phase==="rest") ? "beep_low.wav" : "beep.wav";
    const a=new Audio(file);
    a.play().catch(()=>{});
}

function format(sec){
    let m=Math.floor(sec/60)
    let s=Math.floor(sec%60)
    return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")
}

function selectExercise(name,work,rest,s){
    exerciseName=name
    workTime=work
    restTime=rest
    sets=s
    status.innerText=name+" | "+sets+" подходов"
}

button.onclick=function(){

    if(phase==="idle"){
        start()
    }else{
        stop()
    }

}

function start(){

    if(!exerciseName) return

    currentSet=1
    phase="work"
    requestWakeLock()

    startBtn.style.display="none"
    stopBtn.style.display="block"

    startPhase(workTime)

}

function stop(){

    cancelAnimationFrame(animationId)

    phase="idle"

    greenFill.setAttribute("width",0)

    startBtn.style.display="block"
    stopBtn.style.display="none"

    status.innerText="Остановлено"
    releaseWakeLock()

}

function startPhase(duration){

    phaseDuration=duration
    phaseStart=performance.now()

    playBeep()

    animate()

}


function setLabel(text){
    if(label.textContent===text) return;
    label.style.opacity=0;
    setTimeout(()=>{
        label.textContent=text;
        label.style.opacity=1;
    },20);
}

function animate(){

    let now=performance.now()
    let elapsed=(now-phaseStart)/1000

    let progress=Math.min(elapsed/phaseDuration,1)

    if(phase==="work"){

        setLabel(currentSet+" / "+sets)
        greenFill.setAttribute("width",560*progress)

    }
    else if(phase==="rest"){

        setLabel("Отдых")
        greenFill.setAttribute("width",560*(1-progress))

    }

    let remaining=Math.max(phaseDuration-elapsed,0)
    timer.innerText=format(remaining)

    if(progress>=1){

        nextPhase()
        return

    }

    animationId=requestAnimationFrame(animate)

}

function nextPhase(){

    if(phase==="work"){

        if(currentSet>=sets){

            stop()
            status.innerText="Упражнение завершено"
            return

        }

        phase="rest"
        status.innerText="Отдых"

        startPhase(restTime)

    }
    else{

        phase="work"
    requestWakeLock()
        currentSet++

        greenFill.setAttribute("width",0)

        status.innerText=exerciseName+" | подход "+currentSet+"/"+sets

        startPhase(workTime)

    }

}

</script>

</body>
</html>
